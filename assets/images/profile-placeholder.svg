<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 460" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111c35" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="400" height="460" rx="20" fill="url(#bg)"/>
  <rect width="400" height="460" rx="20" fill="url(#grid)"/>
  
  <!-- Subtle ambient halo -->
  <circle cx="200" cy="200" r="140" fill="url(#glow)" filter="blur(40px)"/>

  <!-- Outer frame border with cyber cut corner accents -->
  <rect x="12" y="12" width="376" height="436" rx="14" stroke="#334155" stroke-width="1.2" stroke-dasharray="8 6"/>
  
  <!-- Tech Crosshairs & Nodes -->
  <circle cx="36" cy="36" r="3" fill="#10b981"/>
  <circle cx="364" cy="36" r="3" fill="#06b6d4"/>
  <circle cx="36" cy="424" r="3" fill="#06b6d4"/>
  <circle cx="364" cy="424" r="3" fill="#10b981"/>

  <!-- Central Avatar Silhouette / Placeholder -->
  <g transform="translate(100, 90)">
    <!-- Shield / Silhouette base -->
    <rect x="0" y="0" width="200" height="200" rx="100" fill="#1e293b" stroke="url(#lineGrad)" stroke-width="2"/>
    
    <!-- User Avatar Icon / Minimalist Tech Head -->
    <circle cx="100" cy="72" r="38" fill="#334155" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.6"/>
    <path d="M46 168 C52 122, 148 122, 154 168" fill="#334155" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6"/>
    
    <!-- Monogram badge -->
    <rect x="68" y="152" width="64" height="26" rx="13" fill="#0b1120" stroke="url(#lineGrad)" stroke-width="1.5"/>
    <text x="100" y="169" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#10b981" text-anchor="middle" letter-spacing="1">ERFAN</text>
  </g>

  <!-- Status card overlay -->
  <g transform="translate(48, 330)">
    <rect width="304" height="74" rx="12" fill="#0b1329" fill-opacity="0.9" stroke="#1e293b" stroke-width="1"/>
    
    <circle cx="28" cy="37" r="6" fill="#10b981"/>
    <circle cx="28" cy="37" r="10" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4">
      <animate attributeName="r" values="6;13;6" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.8;0;0.8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    
    <text x="48" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Informatics Student</text>
    <text x="48" y="52" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Universitas Ahmad Dahlan</text>
  </g>
</svg>

